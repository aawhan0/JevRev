[project]
name = "jevrev"
version = "0.1.0"
description = "Benchmarking cost-aware AI routing with Jev"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

